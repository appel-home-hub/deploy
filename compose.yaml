name: home-hub

# Every Home Hub component, deployed as one Portainer stack.
# Images are built by each component repo's GitHub Action and pulled from GHCR.
# Values in ${...} come from the stack's environment variables (see .env.example).

services:
  time-date:
    image: ghcr.io/appel-home-hub/time-date:latest
    container_name: time-date
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}
      TZ: ${TZ:-America/Chicago}

  weather:
    image: ghcr.io/appel-home-hub/weather:latest
    container_name: weather
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}
      TZ: ${TZ:-America/Chicago}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      LATITUDE: ${LATITUDE}
      LONGITUDE: ${LONGITUDE}

  garage-doors:
    image: ghcr.io/appel-home-hub/garage-doors:latest
    container_name: garage-doors
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}

  zigbee:
    image: ghcr.io/appel-home-hub/zigbee:latest
    container_name: zigbee
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}

  counters:
    image: ghcr.io/appel-home-hub/counters:latest
    container_name: counters
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}

  firebase:
    image: ghcr.io/appel-home-hub/firebase:latest
    container_name: firebase
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}
      FIREBASE_CONFIG_URL: ${FIREBASE_CONFIG_URL}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL}

  ecobee:
    image: ghcr.io/appel-home-hub/ecobee:latest
    container_name: ecobee
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}
      ECOBEE_API_KEY: ${ECOBEE_API_KEY}
      ECOBEE_REFRESH_TOKEN: ${ECOBEE_REFRESH_TOKEN}
    volumes:
      # keeps the latest (rotated) refresh token across redeploys
      - ecobee-data:/data

  broadlink:
    image: ghcr.io/appel-home-hub/broadlink:latest
    container_name: broadlink
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}
      BROADLINK_CONFIG_URL: ${BROADLINK_CONFIG_URL}

  adb-remote:
    image: ghcr.io/appel-home-hub/adb-remote:latest
    container_name: adb-remote
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}
      ADB_CONFIG_URL: ${ADB_CONFIG_URL}
    volumes:
      # adb's key pair; each device approves it once
      - adb-keys:/root/.android

  radio-frequency:
    image: ghcr.io/appel-home-hub/radio-frequency:latest
    container_name: radio-frequency
    restart: unless-stopped
    environment:
      MQTT_HOST: ${MQTT_HOST}
      RF_COMMANDS_URL: ${RF_COMMANDS_URL}
      # one line per env: reference in the RF config gist
      RF_SHOPVAC1: ${RF_SHOPVAC1}
      RF_SHOPVAC2: ${RF_SHOPVAC2}
      RF_XMASLIGHTS: ${RF_XMASLIGHTS}
      RF_OFFICELIGHTS: ${RF_OFFICELIGHTS}
      RF_FIREPLACE: ${RF_FIREPLACE}
      RF_BACKDOOR1: ${RF_BACKDOOR1}
      RF_BACKDOOR2: ${RF_BACKDOOR2}
      RF_BASEMENTLIGHTS: ${RF_BASEMENTLIGHTS}
      RF_SERVERLIGHT: ${RF_SERVERLIGHT}
      RF_WORKBENCHLIGHT: ${RF_WORKBENCHLIGHT}
      RF_MOTORCYCLE: ${RF_MOTORCYCLE}

# named volumes survive Pull and redeploy; only deleting the volume itself removes them
volumes:
  ecobee-data:
  adb-keys:
